name: insta_picker
description: Instagram Picker.
version: 0.1.1
homepage: https://github.com/mstrkn/InstaPicker.git
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  visibility_detector: ^0.4.0+2
  just_the_tooltip: ^0.0.12
  video_trimmer: ^5.0.0
  photo_manager: ^3.12.0
  image_cropper: ^12.2.1
  video_player: ^2.14.0
  photo_view: ^0.15.0
  fluttertoast: ^10.0.2
  provider: ^6.1.5
  camera: ^0.12.1
  chewie: ^1.17.2
  logger: ^2.8.0
  path: ^1.9.1
  image: ^4.10.1

  photofilters:
    git:
      url: https://github.com/noeGnh/photofilters.git
      ref: f48c58ae91292d7a871e197ae34e1bb493ef6173

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
